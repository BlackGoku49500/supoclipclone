name: Lite container
on:
  push:
    branches: [main, feat/supoclip-lite]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && make check && npm run test:brain
      - run: docker build -t supoclip-lite:ci .
      - run: sh tests/container.sh supoclip-lite:ci
